name: Daily Lime Intel Update

on:
  schedule:
    - cron: '0 22 * * 1-5'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest

    env:
      USDA_API_KEY: ${{ secrets.USDA_API_KEY }}
      BANXICO_TOKEN: ${{ secrets.BANXICO_TOKEN }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pandas numpy scikit-learn requests

      - name: Create .env
        run: |
          echo "USDA_API_KEY=${USDA_API_KEY}" > .env
          echo "BANXICO_TOKEN=${BANXICO_TOKEN}" >> .env

      - name: Update prices
        run: python3 scripts/update_prices.py --solo-fetch

      - name: Fetch external data
        run: python3 scripts/fetch_external_data.py

      - name: Fetch lluvia NASA
        run: python3 scripts/fetch_lluvia_nasa.py

      - name: Build model base
        run: python3 scripts/build_model_base.py

      - name: Generate forecast
        run: python3 scripts/generate_forecast.py

      - name: Commit and push
        run: |
          git config user.name "lime-intel-bot"
          git config user.email "bot@lime-intel"
          git add data/processed/
          git diff --staged --quiet || git commit -m "auto update $(date +%Y-%m-%d)"
          git push
